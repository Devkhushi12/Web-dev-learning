<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Decoration color</title>
    <style>
        h2{
            color: rgb(3, 124, 180);
            text-decoration: underline;
        }
        #a{text-decoration-color: blue;}
        #b{text-decoration-color: rgb(182, 182, 7);}
        #c{text-decoration-color: rgb(143, 10, 54);}
        #d{text-decoration-color: red }
    </style>
</head>
<body>
    <h1>Text Transform Property :</h1>
    <h2 id="a">First Heading</h2>
    <h2 id="b">Second Heading</h2>
    <h2 id="c">Third Heading</h2>
    <h2 id="d">Fourth Heading</h2>
</body>
</html>
