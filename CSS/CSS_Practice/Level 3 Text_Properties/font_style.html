<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Font Style</title>
    <style>
        #a{
            font-style: italic;
            color: purple;
        }
        #b{
            font-style: oblique;
            color: rgb(13, 218, 13);
        }
        #c{
            font-style:normal;
            color: rgb(31, 84, 199);
        
        }
    </style>
</head>
<body>
    <h2>Font Style Properties :</h2>

    <p id="b">Lorem ipsum dolor sit amet consectetur adipisicing elit. Harum, repellat?</p>

</html>
