<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Transform Property</title>
    <style>
        h2{
            color: purple;
        }
        #a{text-transform: uppercase;}
        #b{text-transform: lowercase;}
        #c{text-transform: capitalize;}
        #d{text-transform: none;}
    </style>
</head>
<body>
    <h1>Text Transform Property :</h1>
    <h2 id="a">First Heading</h2>
    <h2 id="b">Second Heading</h2>
    <h2 id="c">Third Heading</h2>
    <h2 id="d">Fourth Heading</h2>
</body>
</html>
