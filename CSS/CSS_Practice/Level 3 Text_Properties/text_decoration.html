<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Decoration</title>
    <style>
        #box1{text-decoration: underline;}
        #box2{text-decoration: overline;}
        #box3{text-decoration: line-through;}
        .box{
            background-color: palevioletred;
            height: 100px;
            width: 100px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h2 id="box1" class="box">Box1</h2>
    <h2 id="box2" class="box">Box1</h2>
    <h2 id="box3" class="box">Box1</h2>
    <a href="#">Link 1</a><br>
    <a href="#" style="text-decoration: none;">Link 2</a>
</body>
</html>
