<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Decoration Style</title>
   <style>
   .box{
    text-decoration: underline;
    color: blue;
    }
   #box1{text-decoration-style: dotted;}
   #box2{text-decoration-style: double;}
   #box3{text-decoration-style: dashed;}
   #box4{text-decoration-style: solid;}
   #box5{text-decoration-style: wavy;}
   </style>
</head>
<body>
    <h1>List of Boxes</h1>
    <h2 id="box1" class="box">Python</h2>
    <h2 id="box2" class="box">Java </h2>
    <h2 id="box3" class="box">Html</h2>
    <h2 id="box4" class="box">Javascript</h2>
    <h2 id="box5" class="box">Databse</h2>
</body>
</html>
