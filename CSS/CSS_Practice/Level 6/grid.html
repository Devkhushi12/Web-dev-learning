<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Property</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .box{
            height: 70px;
            width: 70px;
            margin: 5px;
            border: 2px solid black;

            
        }
        h2{
            margin: 30px;
        }
        #container{
             height: 250px;
             width: 300px;
             margin: 20px;
             padding: 10px;
             border: 2px solid black;
             

            display: grid;
            grid-template-columns: 80px 80px;
            grid-template-rows: 80px 80px;
           
        }
        #box1{
            background-color: rgb(235, 174, 186);
            grid-column: 1/2;
            grid-row:1/2 ;
        }
        #box2{
            background-color: rgb(116, 116, 170);
             grid-column: 2/2 ;
            grid-row: 1/2;
        }
        #box3{
            background-color: rgb(236, 205, 125);
             grid-column: 1/2;
            grid-row: 2/2;
        }
        #box4{
            background-color: rgb(218, 130, 177);
             grid-column: 2/2;
            grid-row: 2/2;
        }
    </style>
</head>
<body>
    <h2>Grid Container :</h2>
    <div id="container">
        <div id="box1" class="box">Flex item1</div>
        <div id="box2" class="box">Flex item2</div>
        <div id="box3" class="box">Flex item3</div>
        <div id="box4" class="box">Flex item4</div>
    </div>
</body>
</html>
