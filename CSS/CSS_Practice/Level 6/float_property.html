<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Float Porperty</title>
    <style>
        #container{
            height: 100px;
            width: 300px;
            border: 2px solid blue;
        }
        .box{
            width: 100px;
            height: 100px;
            
        }
        #box1{
            background-color: aqua;
            float: left;
        }
        #box2{
            background-color: blueviolet;
            float: right;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="box1" class="box">Box1</div>
        <div id="box2" class="box">Box2</div>
    </div>
</body>
</html>
