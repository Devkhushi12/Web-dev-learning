<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexItems Order</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .box{
            height: 80px;
            width: 80px;
            margin: 20px;
            border: 2px solid black;
        }
        h2{
            margin: 30px;
        }
        #container{
            height: 250px;
            width: 500px;
            margin: 30px;
            padding: 10px;
            border: 2px solid black;
            text-align: center;

            display: flex;
            flex-direction: row;
            justify-content: center;
           
        }
        #box1{
            background-color: rgb(235, 174, 186); 
            order: 3;
        }
        #box2{
            background-color: rgb(116, 116, 170);
            order: 2;
        }
        #box3{
            background-color: rgb(236, 205, 125);
            order: 4;
        }
        #box4{
            background-color: rgb(218, 130, 177);
            order: 1;
        }
    </style>
</head>
<body>
    <h2>Flexbox Container :</h2>
    <div id="container">
        <div id="box1" class="box">Flex item1</div>
        <div id="box2" class="box">Flex item2</div>
        <div id="box3" class="box">Flex item3</div>
        <div id="box4" class="box">Flex item4</div>
    </div>
</body>
</html>
