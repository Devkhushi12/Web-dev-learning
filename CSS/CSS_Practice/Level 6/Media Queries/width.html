<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Queries </title>
    <style>
        .box{
            height: 100px;
            width: 100px;
            padding: 10px;
            background-color: lightcoral;
        }
        @media screen and (width: 200px) {
            .box{
                background-color: aqua;
            }
        }
    </style>
</head>
<body>
    <div class="box">Box</div>
</body>
</html>
