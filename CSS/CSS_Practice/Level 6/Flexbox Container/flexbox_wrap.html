<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Wrap Property</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        h2{
            margin: 10px;
            text-align: center;
        }
        #container{
            height: 500px;
            width: 500px;
            padding: 10px;
            text-align: center;
            margin-left: 300px;
            border: 2px solid black;
            background-color: lavender;

            display: flex;
            flex-wrap: wrap;
           /* flex-wrap: nowrap;
            flex-wrap: wrap-reverse;*/
        }
        .box{
            height: 140px;
            width: 140px;
            border: 2px solid black;
            margin: 5px;
        }
        #box1{background-color: chartreuse;}
        #box2{background-color: cornflowerblue;}
        #box3{background-color: coral;}
        #box4{background-color: crimson;}
        #box5{background-color: coral;}
        #box6{background-color: rgb(168, 11, 207);}
        #box7{background-color: rgb(241, 34, 155);}
        #box8{background-color: rgb(9, 189, 78);}
    </style>
</head>
<body>
    <h2>Flex Container</h2>
    <div id="container">
        <div class="box" id="box1">Item1</div>
        <div class="box" id="box2">Item2</div>
        <div class="box" id="box3">Item3</div>
        <div class="box" id="box4">Item4</div>
        <div class="box" id="box5">Item5</div>
        <div class="box" id="box6">Item6</div>
        <div class="box" id="box7">Item7</div>
        <div class="box" id="box8">Item8</div>
    </div>
</body>
</html>
