<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Justify</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        h4{
            margin: 5px;
        }
        .box{
            height: 20px;
            width: 20px;
            background-color: deeppink;
            border: 1px solid blue;
            margin: 5px;
            
        }
        .container{
            height: 30px;
            width: 500px;
            margin: 5px;
            padding: 2px;
            border: 2px solid black;
            background-color: lavender;
        }
        #container1{
            display: flex;
            justify-content: flex-start;
        }
        #container2{
            display: flex;
            justify-content: flex-end;
        }
        #container3{
            display: flex;
            justify-content: center;
        }
        #container4{
            display: flex;
            justify-content: space-between;
        }
        #container5{
            display: flex;
            justify-content: space-around;
        }
        #container6{
            display: flex;
            justify-content: space-evenly;
        }
    </style>
</head>
<body>
    <h4>Flex-start :</h4>
    <div id="container1" class="container">
        <div class="box">A</div>
        <div class="box">B</div>
        <div class="box">C</div>
        <div class="box">D</div>
    </div>
    <h4>Flex-end :</h4>
    <div id="container2" class="container">
        <div class="box">E</div>
        <div class="box">F</div>
        <div class="box">G</div>
        <div class="box">H</div>
    </div>
    <h4>Flex-center :</h4>
    <div id="container3" class="container">
        <div class="box">I</div>
        <div class="box">J</div>
        <div class="box">K</div>
        <div class="box">L</div>
    </div>
    <h4>Flex-space-between :</h4>
    <div id="container4" class="container">
        <div class="box">M</div>
        <div class="box">N</div>
        <div class="box">O</div>
        <div class="box">P</div>
    </div>
    <h4>Flex-space-around :</h4>
    <div id="container5" class="container">
        <div class="box">Q</div>
        <div class="box">R</div>
        <div class="box">S</div>
        <div class="box">T</div>
    </div>
    <h4>Flex-space-evenly :</h4>
    <div id="container6" class="container">
        <div class="box">U</div>
        <div class="box">V</div>
        <div class="box">W</div>
        <div class="box">X</div>
    </div>
</body>
</html>
