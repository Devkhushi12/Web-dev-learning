<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Align Item</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        h2{
            margin: 10px;
            text-align: center;
        }
        #container{
            height: 500px;
            width: 500px;
            padding: 10px;
            text-align: center;
            margin-left: 300px;
            border: 2px solid black;
            background-color: lavender;

            display: flex;
            justify-content: center;
            align-items: center;
        }
        .box{
            height: 140px;
            width: 140px;
            border: 2px solid black;
            margin: 5px;
        }
        #box1{background-color: chartreuse;}
        #box2{background-color: cornflowerblue;}
        #box3{background-color: coral;}
        #box4{background-color: crimson;}
        #box5{background-color: coral;}
    </style>
</head>
<body>
    <h2>Flex Container</h2>
    <div id="container">
        <div class="box" id="box1">Item1</div>
        <div class="box" id="box2">Item2</div>
        <div class="box" id="box3">Item3</div>
        <div class="box" id="box4">Item4</div>
        <div class="box" id="box5">Item5</div>
    </div>
</body>
</html>
