<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position Property</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .box{
            height: 100px;
            width: 100px;
            margin: 10px;
        }
        #box1{
            background-color: aquamarine;
            position: static;

        }
        #box2{
            background-color: fuchsia;
            position: relative;
            top: 10px;
            left: 30px;
        }
        #box3{
            background-color: orange;
            position: absolute;
            top: 20px;
            
        }
        #box4{
            background-color: orchid;
            position: fixed;
            left: 60px;
        }
    </style>
</head>
<body>
    <div id="box1" class="box">Box 1</div>
    <div id="box2" class="box">Box 2</div>
    <div id="box3" class="box">Box 3</div>
    <div id="box4" class="box">Box 4</div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    
</body>
</html>
