<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psuedo classes</title>
    <style>
        .psuedo{
            height: 40px;
            width: 180px;
            margin: 20px;
            background-color: darksalmon;
            border: 2px solid black;
            border-radius: 20px;
        }
        .psuedo:hover{
            height: 50px;
            width: 200px;
            background-color: gold;
        }
        .psuedo:active{
            background-color: darkcyan;
        }
    </style>
</head>
<body>
 <button class="psuedo">Psuedo Learing</button>
</body>
</html>
