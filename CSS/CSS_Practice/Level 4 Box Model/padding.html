<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padding Properties</title>
    <style>
        #first{
            height: 100px;
            width: 100px;
            background-color: mediumvioletred;
            padding: 20px;
        }
         #second{
            height: 100px;
            width: 100px;
            background-color:blue;
            padding: 5px 15px 20px 25px;
        }
    
    </style>
</head>
<body>
  <div id="first">Padding 1</div> <br> 
  <div id="second">Padding 2</div>  
</body>
</html>
