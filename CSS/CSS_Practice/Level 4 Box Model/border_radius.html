<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Border Radius Properties</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .a{
           height: 200px;
            width: 200px;
            margin: 20px;
            text-align: center;
        }
        #button1{
            background-color: aquamarine;
            border: 5px solid blue;
            border-radius: 50px;
        }
        #button2{
            background-color: yellowgreen;
            border: 5px solid blue;
            border-radius: 20px 100px 50px 20px;
        }
    </style>
</head>
<body>
    <button id="button1" class="a">Click Me</button>
    <button id="button2" class="a"> Again Click Me</button>
</body>
</html>
