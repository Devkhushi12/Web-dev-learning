<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Border Properties</title>
    <style>
        *{
            margin: 30px;
            padding: 0;
        }
        #box{background-color: pink; width: 300px; padding: 5px; text-align: center;}
        #a{
            border: 2px solid red;
        }
        #b{
            border: 2px dashed blue;
        }
        #c{
            border: 2px dotted navy;
        }
        #d{
            border: 2px double blueviolet;
        }
    </style>
</head>
<body>
    <div id="box">
        <h2 id="a">Heading 1</h2>
        <h2 id="b">Heading 2</h2>
        <h2 id="c">Heading 3</h2>
        <h2 id="d">Heading 4</h2>
    </div>
</body>
</html>
