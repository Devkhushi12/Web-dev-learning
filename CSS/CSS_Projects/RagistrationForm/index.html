<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>
<body>

<div class="form-container">
    <h1>Create An Account</h1>

    <div class="row">
        <div class="input-box">
            <label>First Name</label>
            <input type="text" placeholder="Enter your fisrt name">
        </div>

        <div class="input-box">
            <label>Last Name</label>
            <input type="text" placeholder="Enter your last name">
        </div>
    </div>

    <div class="row">
        <div class="input-box">
            <label>Email</label>
            <input type="email" placeholder="example@gamil.com">
        </div>

        <div class="input-box">
            <label>DOB</label>
            <input type="date">
        </div>
    </div>

    <div class="row">
        <div class="input-box">
            <label>Create Password</label>
            <input type="password" required>
        </div>

        <div class="input-box">
            <label>Confirm Password</label>
            <input type="password" required>
        </div>
    </div>

    <div class="row">
         <div class="input-box">
            <label for="">Gender</label>
            <select>
                <option>Gender</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
            </select>
        </div>
        <div class="input-box">
            <label>Select City</label>
            <select>
                <option value="">City</option>
                <option value="">Azamgarh</option>
                <option value="">Lucknow</option>
                <option value="">Banaras</option>
                <option value="">Juanpur</option>
                <option value="">Bhadohi</option>
            </select>
        </div>
    </div>

     <div class="row">
        <div class="input-box">
            <label>Address</label>
            <input type="text" placeholder="Enter your full address">
        </div>
    </div>
    
    <button>Create Account</button>
    

</div>

</body>
</html>
