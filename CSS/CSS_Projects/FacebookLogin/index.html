<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Login Page</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>
<body>
    <div id="container">
        <div class="container1">
            <div class="facebook_icon">
                <i class="fa-brands fa-facebook " style="color: rgb(17, 139, 233); font-size: 50px;"></i>
            </div>
            <div class="facebook_text">
                <h1>Find</h1>
                <h1>things</h1>
                <h1 style="color:rgb(11, 115, 196);">you love.</h1>
            </div>
        </div>
        <div class="container2">
            <img class="image" src="images/HpEiFYDux5j.webp" alt="">
        </div>
        <div class="container3">
            <div class="facebook_login">
                <h6>Log in to Facebook</h6>
                <div>
                <input type="text" name="text" placeholder="Email or mobile number" required class="input_button">
                <input type="password" name="password" placeholder="Password" required class="input_button">
                </div>
              <div>
                    <button class="button1">log in</button>
                    <button class="button2">Forgate password ?</button>
                    <button class="button3">Create a new account</button>
              </div>
            </div>
        </div>
    </div>
    <hr>
    <footer>footer</footer>
</body>
</html>
