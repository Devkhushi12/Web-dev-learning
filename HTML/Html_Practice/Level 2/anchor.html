<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Hyperlinks</title>
</head>
<body>
    <!--Hyper links-->
    <a href="https://www.w3schools.com/">w3schools.com</a><br>
    <a href="https://www.google.com/" target="_blank">Google</a><br>
    <a href="https://www.instagram.com/" target="_parent">Instagram</a><br>
    <a href="https://www.youtube.com/" target="_self">Youtube</a>
</body>
</html>
