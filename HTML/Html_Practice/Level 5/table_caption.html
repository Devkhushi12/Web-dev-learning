<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Caption</title>
</head>
<body>
    <table border="2">
        <caption>Students Information</caption>
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Email</th>
        </tr>
        <tr>
            <td>Khushi</td>
            <td>20</td>
            <td>Khushi@email.com</td>
        </tr>
        <tr>
            <td>Mahi</td>
            <td>21</td>
            <td>mahi@email.com</td>
        </tr>
        <tr>
            <td>Manvi</td>
            <td>21</td>
            <td>m@email.com</td>
        </tr>
    </table>
</body>
</html>
