<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All form tag</title>
</head>
<body>
<h4>All Form tag</h4>
    <form>
        Name : <input type="text" placeholder="Enter your name"><br><br>
        Password : <input type="password" placeholder="Enter your password"><br><br>
        Age : <input type="number" placeholder="age"><br><br>
        Email : <input type="email" placeholder="example@email.com"><br><br>
        Date : <input type="date" placeholder="date"><br><br>
        Gender : <input type="radio">Male <input type="radio">Female <input type="radio">Other <br>
        Choice : <input type="checkbox">Math <input type="checkbox">Chemistry <br><br>
        File : <input type="file"><br><br>
        Color : <input type="color"><br><br>
        Range : <input type="range"><br><br>
        Button : <input type="button" value="click me "><br><br>
        Submit : <input type="submit">
    </form>
</body>
</html>
